<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웹 바닐라 JS 프로젝트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h1 { font-size: 1.5rem; color: #1f2937; margin-bottom: 0.5rem; }
    p { color: #6b7280; margin-bottom: 1.5rem; font-size: 0.95rem; }
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    .btn {
      display: block;
      padding: 12px 20px;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-clock { background-color: #3b82f6; }
    .btn-clock:hover { background-color: #2563eb; }
    .btn-calc { background-color: #10b981; }
    .btn-calc:hover { background-color: #059669; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 웹 바닐라 JS 프로젝트</h1>
    <p>아래에서 실행할 프로젝트를 선택해주세요!</p>
    <div class="btn-group">
      <!-- absolute path 사용으로 404 완벽 방지 -->
      <a href="/web-project/clock/index.html" class="btn btn-clock">⏰ 디지털 시계 실행하기</a>
      <a href="/web-project/calculator/index.html" class="btn btn-calc">🧮 웹 계산기 실행하기</a>
    </div>
  </div>
</body>
</html>
