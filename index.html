<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>웹 프로젝트 모음</title>
  <!-- 접속하자마자 자동으로 시계 화면으로 넘겨주는 설정 -->
  <meta http-equiv="refresh" content="0; url=./clock/">
  <style>
    body {
      font-family: -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f4f6f8;
      margin: 0;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .btn {
      display: inline-block;
      margin: 10px;
      padding: 12px 24px;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>🚀 바닐라 JS 프로젝트 메뉴</h2>
    <p>잠시 후 시계 프로젝트로 자동 이동합니다...</p>
    <div>
      <a href="./clock/" class="btn" style="background-color: #2563eb;">⏰ 시계 보기</a>
      <a href="./calculator/" class="btn" style="background-color: #10b981;">🧮 계산기 보기</a>
    </div>
  </div>
</body>
</html>
